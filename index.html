<!DOCTYPE html>
<html>
<head>
    <script>
        // Automatically reads the shortcut name from the URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const shortcutName = urlParams.get('name');
        const placeId = urlParams.get('placeId');
        if (shortcutName && placeId) {
            window.location.href = `shortcuts://run-shortcut?name=${encodeURIComponent(shortcutName)}&input=text&text=${placeId}`;
        }
    </script>
</head>
<body>
    <p>Launching shortcut...</p>
</body>
</html>
